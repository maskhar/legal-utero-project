map $host $seo_robots {
    default "noindex, nofollow";
    legal.iuteroindonesia.com "index, follow";
}

limit_req_zone $binary_remote_addr zone=trademark_search:10m rate=5r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $seo_robots always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.google.com https://*.gstatic.com https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com https://www.googletagmanager.com; font-src 'self'; connect-src 'self' https://cloudflareinsights.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api/merek/search {
        access_log off;
        limit_except GET { deny all; }
        limit_req zone=trademark_search burst=20 nodelay;
        limit_req_status 429;
        if ($arg_q !~ "^[a-zA-Z0-9%+_.-]{2,720}$") { return 400; }
        if ($arg_class !~ "^([1-9]|[1-3][0-9]|4[0-5])?$") { return 400; }
        if ($arg_page !~ "^[1-9][0-9]{0,3}$") { return 400; }
        if ($arg_limit != "10") { return 400; }
        proxy_pass https://use.apiindonesia.id/api/v1/merek/search;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host use.apiindonesia.id;
        proxy_set_header x-api-key "${API_INDONESIA}";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location ~* ^/assets/.*\.(?:css|js|png|jpg|jpeg|webp|avif|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~ /\. {
        deny all;
    }
}
